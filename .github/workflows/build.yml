name: Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (all targets)
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: secretariat-${{ matrix.os }}
          path: |
            target/release/secretd
            target/release/secret

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archive
        run: |
          mkdir -p release
          # macOS ARM
          cp secretariat-macos-latest/secretd release/secretd-darwin-arm64
          cp secretariat-macos-latest/secret release/secret-darwin-arm64
          # Linux x64
          cp secretariat-ubuntu-latest/secretd release/secretd-linux-x86_64
          cp secretariat-ubuntu-latest/secret release/secret-linux-x86_64
          # Archive
          cd release && tar czf ../secretariat-${{ github.ref_name }}.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: secretariat-*.tar.gz
          body_path: CHANGELOG.md
          draft: true
