name: Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Staging (pre-test — tests run natively and can invalidate cross-target builds)
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/secretd staging/
          cp target/${{ matrix.target }}/release/secret staging/

      - name: Run tests
        run: cargo test --workspace

      - name: Create archive
        run: |
          cd staging && tar czf ../secretariat-${{ matrix.artifact }}.tar.gz .

      - name: Generate SHA256
        run: |
          sha256sum secretariat-${{ matrix.artifact }}.tar.gz | tee secretariat-${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretariat-${{ matrix.artifact }}
          path: |
            secretariat-${{ matrix.artifact }}.tar.gz
            secretariat-${{ matrix.artifact }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          echo "## SHA256 Checksums" > sha256.txt
          for dir in secretariat-*; do
            arch="${dir#secretariat-}"
            cp "$dir/secretariat-${arch}.tar.gz" .
            cat "$dir/secretariat-${arch}.sha256" >> sha256.txt
          done
          cat sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            secretariat-*.tar.gz
            sha256.txt
          body_path: CHANGELOG.md
          draft: true
