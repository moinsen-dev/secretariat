[package]
name = "secretariat-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# Thin C ABI around secretariat-core so the iOS app (and any non-Rust host)
# can run byte-identical Argon2id + AES-256-GCM via dart:ffi. cdylib for
# desktop/dev (DynamicLibrary.open), staticlib for the iOS app link.

[lib]
name = "secretariat_core_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
secretariat-core = { path = "../core" }
