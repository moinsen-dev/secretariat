<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D8CF0"/>
      <stop offset="1" stop-color="#004BA0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F1FB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#001B3D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- rounded-rect body (macOS squircle-style, transparent corners) -->
  <rect x="112" y="112" width="800" height="800" rx="184" ry="184"
        fill="url(#bg)" filter="url(#shadow)"/>

  <!-- shield -->
  <path d="M512 300
           C560 300 620 316 664 332
           L664 532
           C664 628 596 692 512 724
           C428 692 360 628 360 532
           L360 332
           C404 316 464 300 512 300 Z"
        fill="url(#shield)"/>

  <!-- keyhole -->
  <g fill="#0B5FB0">
    <circle cx="512" cy="470" r="48"/>
    <path d="M488 500 L536 500 L550 600 L474 600 Z"/>
  </g>
</svg>
