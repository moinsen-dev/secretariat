[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretariat"
version = "0.1.0"
description = "Python SDK for Secretariat local secrets manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Secretariat Team" }
]
keywords = ["secrets", "security", "api-keys", "credentials", "vault"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/secretariat/secretariat"
Documentation = "https://secretariat.dev/docs/sdk/python"
Repository = "https://github.com/secretariat/secretariat"

[tool.hatch.build.targets.wheel]
packages = ["secretariat"]

[tool.hatch.build.targets.sdist]
include = [
    "/secretariat",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
